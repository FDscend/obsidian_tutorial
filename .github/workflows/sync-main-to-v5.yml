name: Sync main → v5 and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout v5 branch
        uses: actions/checkout@v4
        with:
          ref: v5
          path: v5-branch

      - name: Sync content from main to v5/content/
        run: |
          # 复制需要发布的目录和文件到 v5/content/
          for dir in section0 section1 section2 section3 section4 section5 section6 section7 section8 section9 section10 appendix image; do
            if [ -d "$dir" ]; then
              rsync -a --delete "$dir/" "v5-branch/content/$dir/"
            fi
          done
          # 复制根目录下的单个文件
          for file in markdown格式总结.md README.md; do
            if [ -f "$file" ]; then
              cp "$file" "v5-branch/content/"
            fi
          done
          # 复制 .canvas 文件（如果存在）
          cp *.canvas v5-branch/content/ 2>/dev/null || true

      - name: Sync selected CSS snippets to v5
        run: |
          set -e
          SNIPPETS_SRC=".obsidian.default/snippets"
          SNIPPETS_DST="v5-branch/quartz/styles/snippets"
          CONFIG_FILE="$SNIPPETS_SRC/.web-snippets"

          echo "📁 源目录: $SNIPPETS_SRC"
          echo "📁 目标目录: $SNIPPETS_DST"

          # 确保目标目录存在
          mkdir -p "$SNIPPETS_DST"

          # 如果配置文件不存在，跳过
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "⚠️  未找到 $CONFIG_FILE，跳过 CSS 片段同步"
            exit 0
          fi

          # 清空目标目录旧的 CSS 文件（保留默认 _index.scss）
          find "$SNIPPETS_DST" -type f -not -name '_index.scss' -delete

          # 初始化一个数组保存成功复制的文件名
          COPIED_FILES=()

          # 读取配置文件，逐行处理
          while IFS= read -r line || [ -n "$line" ]; do
            # 去除首尾空格
            trimmed=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            # 跳过空行和注释行
            if [ -z "$trimmed" ]; then
              continue
            fi
            case "$trimmed" in
              \#*) continue ;;
            esac
            # 检查源文件是否存在
            if [ -f "$SNIPPETS_SRC/$trimmed" ]; then
              cp "$SNIPPETS_SRC/$trimmed" "$SNIPPETS_DST/"
              echo "✅ 已复制: $trimmed"
              COPIED_FILES+=("$trimmed")
            else
              echo "⚠️  文件不存在，跳过: $SNIPPETS_SRC/$trimmed"
            fi
          done < "$CONFIG_FILE"

          echo "📊 共处理 ${#COPIED_FILES[@]} 个 CSS 文件"

          # 生成 _index.scss，供 custom.scss 通过 @use './snippets' 加载
          # 注意：不能用 @import "file.css"，那会生成浏览器级别 CSS @import（额外 HTTP 请求）
          # 正确做法：将 CSS 内容直接内联到 _index.scss 中
          INDEX_SCSS="$SNIPPETS_DST/_index.scss"
          echo "// ⚠️ 此文件由 sync-main-to-v5.yml 工作流自动生成，请勿手动编辑" > "$INDEX_SCSS"
          echo "// 来源: .obsidian.default/snippets/.web-snippets 中列出的文件" >> "$INDEX_SCSS"
          echo "" >> "$INDEX_SCSS"
          for css_file in "${COPIED_FILES[@]}"; do
            echo "/* === $css_file === */" >> "$INDEX_SCSS"
            cat "$SNIPPETS_DST/$css_file" >> "$INDEX_SCSS"
            echo "" >> "$INDEX_SCSS"
          done

          echo "📄 已生成 _index.scss"

      # 还原流程：将同步结果提交并推送到 v5 分支
      # 注意：v5 分支有 PR 保护规则（Changes must be made through a pull request），
      # GITHUB_TOKEN 无法直接推送。若配置了仓库 secret SYNC_PAT（需仓库写权限的 PAT），
      # 工作流会自动用它推送 v5；未配置时推送会被保护规则拦截（仅打印警告），
      # 不影响后续构建部署（部署使用本地 v5-branch/ 副本，内容已同步）。
      # continue-on-error 保证 v5 推送失败不会中断构建部署。
      - name: Commit and push to v5
        continue-on-error: true
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          cd v5-branch

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 先 add content/
          git add content/

          # 再 add snippets/（如果存在）
          if [ -d "quartz/styles/snippets" ]; then
            git add quartz/styles/snippets/
          fi

          # 检查是否有变更
          if git diff --staged --quiet; then
            echo "✅ No changes to sync"
            exit 0
          fi

          git commit -m "sync: 从 main 同步内容更新（含 CSS 片段）"

          # 推送 v5：优先使用 SYNC_PAT，否则用 GITHUB_TOKEN（可能被 PR 保护拦截）
          if [ -n "$SYNC_PAT" ]; then
            echo "📤 使用 SYNC_PAT 推送 v5"
            git push "https://x-access-token:${SYNC_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:v5
          else
            echo "⚠️ 未配置 SYNC_PAT，尝试用 GITHUB_TOKEN 推送 v5"
            git push origin HEAD:v5 || echo "⚠️ v5 推送被 PR 保护拦截（GITHUB_TOKEN 无绕过权限）。如需自动同步到 v5，请在仓库 Settings → Secrets and variables → Actions 中配置 SYNC_PAT。部署仍会继续。"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('v5-branch/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: v5-branch/.quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('v5-branch/quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install Dependencies
        working-directory: v5-branch
        run: npm ci

      - name: Install Quartz plugins
        working-directory: v5-branch
        run: npx quartz plugin install

      - name: Build Quartz
        working-directory: v5-branch
        run: npx quartz build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: v5-branch/public
          publish_branch: gh-pages
